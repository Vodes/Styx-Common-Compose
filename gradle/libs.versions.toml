[versions]
android-minSdk = "27"
android-compileSdk = "37"
agp = "9.5.2"
kotlin = "2.4.21"
styx-common = "0.7.0"
styx-mal = "0.0.4"
anilist-kmp = "0.1.0"
vortex = "0.5.0"
kamel = "1.0.9"
compose = "1.12.2"
multiplatform-settings = "1.3.0"
kstore = "1.1.0"
oshi = "7.8.0"
multiplatform-lifecycle = "2.11.0"
islandtime = "0.7.0"
android-lifecycle = "2.11.1"
semver = "3.1.0"
sonner = "0.4.1"
compose-dialogs = "4.0.0"


[libraries]
styx-common = { module = "moe.styx:styx-common", version.ref = "styx-common" }
styx-mal = { module = "moe.styx:styx-lib-mal", version.ref = "styx-mal" }
anilist-kmp = { module = "pw.vodes:anilist-kmp", version.ref = "anilist-kmp" }
vortex = { module = "io.github.hristogochev:vortex", version.ref = "vortex" }
dialogs-core = { module = "io.github.mflisar.composedialogs:core", version.ref = "compose-dialogs" }
dialogs-list = { module = "io.github.mflisar.composedialogs:dialog-list", version.ref = "compose-dialogs" }
dialogs-number = { module = "io.github.mflisar.composedialogs:dialog-number", version.ref = "compose-dialogs" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }
multiplatform-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "multiplatform-lifecycle" }
multiplatform-islandtime = { module = "io.islandtime:core", version.ref = "islandtime" }
multiplatform-semver = { module = "io.github.z4kn4fein:semver", version.ref = "semver" }
sonner = { module = "moe.styx.forks.dokar3:sonner", version.ref = "sonner" }
kamel-image = { module = "media.kamel:kamel-image-default", version.ref = "kamel" }
kstore = { module = "io.github.xxfast:kstore", version.ref = "kstore" }
kstore-file = { module = "io.github.xxfast:kstore-file", version.ref = "kstore" }
jvm-oshi = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
android-lifecycle-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "android-lifecycle" }

[plugins]
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
